$schema: "http://json-schema.org/draft-07/schema#"
title: "BaseProperties"
type: "object"
properties:
  Id:
    type: "string"
    description: "Unique identifier for the element, a UUID. New ids are minted as uuidv7; ids minted earlier as uuidv4 remain valid"
  Name:
    type: "string"
    description: "Name of the element"
  Description:
    type: "string"
    description: "Any kind of details about the element"
  Supertype:
    type: "string"
    description: "The top level classification of the element within its type"
  Subtype:
    type: "string"
    description: "The sub level classification through which the element is further sorted within its type"
  Image_URL:
    type: "string"
    description: "URL to an image representing the element"
  World:
    type: "string"
    description: "UUID of the world the element is part of"
required: ["Id", "Name"]
